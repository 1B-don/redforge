[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redforge-workbench"
version = "0.14.0"
description = "Scope-controlled Linux security assessment workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "defusedxml>=0.7,<1", "textual>=0.70,<4", "cryptography>=42,<50"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
redforge = "redforge.cli:app"

[tool.setuptools.packages.find]
include = ["redforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Linux tools and an explicit integration job"]
